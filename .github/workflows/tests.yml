name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # ginkgo CLI version is pinned by the `tool` directive in go.mod
      - name: Test
        run: >-
          go tool ginkgo -r
          --race
          --randomize-all
          --fail-on-pending
          --fail-on-empty
          --keep-going
          --github-output
          ./app
